name: redpen

services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: redpen
      POSTGRES_PASSWORD: ${REDPEN_DB_PASSWORD:-redpen}
      POSTGRES_DB: redpen
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redpen -d redpen"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgvector_data:
